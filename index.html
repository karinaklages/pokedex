            <input class="search-input" id="searchInput" type="text" placeholder="Search a Pokémon" required minlength="3">

    </header>

        <div class="load-button-area">
            <button class="load-button" id="loadButton" onclick="loadMorePokemon()">Load more Pokémon</button>
        </div>

            <div id="stats" class="tab-content progress-wrapper content">
                <div class="class-bar">
                    <div class="bar-info">
                        <span>HP</span>
                    </div>
                    <div class="progress-bar">
                        <span class="hp"></span>
                    </div>
                </div>
                <div class="class-bar">

                    <div class="progress-bar">
                        <span class="attack"></span>
                    </div>
                </div>
                <div class="class-bar">
