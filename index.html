<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/main-card.css">
    <link rel="stylesheet" href="./styles/detail-card.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/mobile.css">
    <link rel="icon" href="./assets/icons/favicon.png" type="image/png">
    
    <title>Pokedex</title>
</head>
<body onload="init()">
    <header>
        <a href="index.html" class="logo-area">
            <img class="logo" src="./assets/icons/pokemon-logo.svg" alt="Pokemon Logo">
        </a>
        <div id="searchArea">
            <input class="search-input" id="searchInput" type="text" placeholder="Search a Pokémon" required minlength="3">
            <button class="submit-button" id="submitButton" type="button" onclick="searchPokemonByName()">Submit</button>
        </div>
        <div>
            <p class="alert d_none" id="alert">Pokémon not found. Please load more species to find it on this website.</p>
        </div>
    </header>
    <main>
        <div class="main-card-area" id="mainCardArea"></div>
        <div id="loading-spinner">
            <div class="loading-spinner-circle loading" class="hidden"></div>
        </div>
        <div class="load-button-area">
            <button class="load-button" id="loadButton" onclick="loadMorePokemon()">Load more Pokémon</button>
        </div>
        <dialog id="pokemonDialog" closedby="any"></dialog>
    </main>
    <footer>
        <div class="footer-container">
            <img class="footer-ball" src="./assets/icons/favicon.png" alt="Pokédex Icon">
            <p>© 2025 Pokédex by Karina Klages</p>
        </div>
    </footer>
    
    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>
    <script src="./scripts/dialog.js"></script>
</body>
</html>
