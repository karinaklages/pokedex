<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/main-card.css">
    <link rel="stylesheet" href="./styles/detail-card.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/colors.css">
    <link rel="stylesheet" href="./styles/mobile.css">
    <link rel="icon" href="./assets/icons/favicon.png" type="image/png">
    
    <title>Pokedex</title>
</head>
<body onload="init()">
    <header>
        <div class="logo-area">
            <img class="logo" src="./assets/icons/pokemon-logo.svg" alt="Pokemon Logo">
        </div>
        <div id="searchArea">
            <input class="search-input" id="searchInput" type="text" placeholder="Search a Pokémon" required minlength="3">
            <button class="submit-button" id="submitButton">Submit</button>
        </div>
    </header>
    <main>
        <div class="main-card-area" id="mainCardArea">
            <div class="main-card" onclick="openDialog()">
                <div class="pokemon-number" id="pokemonNumber"><span>#001</span></div>
                <div id="pokemonImgMainCard">
                    <img src="./assets/icons/pokemon-logo.svg" alt="">
                </div>
                <h2 class="pokemon-name-main-card" id="pokemonNameMainCard">Bulbasaur</h2>
                <div class="type-area" id="typeArea">
                    <button class="pokemon-type-button">Grass</button>
                    <button class="pokemon-type-button">Poison</button>
                </div>
            </div>
            <div class="main-card"></div>
            <div class="main-card"></div>
            <div class="main-card"></div>
            <div class="main-card"></div>
            <div class="main-card"></div>
            <div class="main-card"></div>
            <div class="main-card"></div>
            <div class="main-card"></div>
            <div class="main-card"></div>
        </div>

        <div class="load-button-area">
            <button class="load-button" id="loadButton">Load more Pokémon</button>
        </div>

        <dialog id="pokemonDialog" closedby="any">
            <div class="close-area">
                <img class="close-button" src="./assets/icons/closed.png" alt="Close Dialog" aria-label="Close button" onclick="closeDialog()">
            </div>
            <div class="pokemon-number-detail-card"><span>#001</span></div>
            <h2 class="pokemon-name-detail-card">Bulbasaur</h2>
            <div class="type-area-detail-card">
                <button class="pokemon-type-button-detail-card">Grass</button>
                <button class="pokemon-type-button-detail-card">Poison</button>
            </div>
            <div class="arrow-area">
                <img class="arrow-icon" src="./assets/icons/arrow-back.png" alt="Backward Click" aria-label="Backward button" onclick="prevPokemon()">
                <img class="arrow-icon" src="./assets/icons/arrow-forward.png" alt="Forward Click" aria-label="Forward button" onclick="nextPokemon()">
            </div>
            <div class="white-area"></div>

            <div class="menue-detail-card">
                <ul>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Stats</a></li>
                    <li><a href="#">Elevations</a></li>
                </ul>
            </div>

            <div id="about" class="tab-content" style="display:block;">
                <table>
                    <tr>
                        <th>Species</th>
                        <td>xxx</td>
                    </tr>
                    <tr>
                        <th>Height</th>
                        <td>xxx</td>
                    </tr>
                    <tr>
                        <th>Weight</th>
                        <td>xxx</td>
                    </tr>
                    <tr>
                        <th>Abilities</th>
                        <td>xxx</td>
                    </tr>
                    <tr>
                        <th>Weakness</th>
                        <td>xxx</td>
                    </tr>
                </table>
            </div>

            <div id="stats" class="tab-content" style="display:none;">

            </div>

            <div id="elevations" class="tab-content" style="display:none;">
                
            </div>
        </dialog>
    </main>
    <footer>
        <div class="footer-container">
            <img class="footer-ball" src="./assets/icons/favicon.png" alt="Pokédex Icon">
            <p>© 2025 Pokédex by Karina Klages</p>
        </div>
    </footer>
    
    <script src="./script.js"></script>
    <script src="./scripts/templates.js"></script>
</body>
</html>
